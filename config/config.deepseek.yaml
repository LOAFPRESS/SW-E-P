# DeepSeek run over the 150-comment gold sample.
#
# Model naming follows the DeepSeek API as documented on 2026-11: the served
# models are `deepseek-flash` (DeepSeek-V4.1-Flash-1017) and `deepseek-v4-pro`
# (V4-Pro-0813).  The older `deepseek-chat` / `deepseek-reasoner` aliases are no
# longer in the documentation, so they are not used here.
#
# Thinking is toggled with `reasoning_effort`:
#   * Stage-1 is a classification task -> thinking off (`none`), temperature 0,
#     which keeps it cheap and directly comparable with the paper's gpt-4.1 pass.
#   * Stage-2 has to reason about whether later commits implement the suggestion
#     -> thinking on (`high`).  DeepSeek ignores `temperature` while thinking, so
#     the paper's temperature=0 is recorded as DEV-09.
#
# Stage-2 quality can be pushed further by switching `stage2_model` to
# `deepseek-v4-pro` (input 1.32 / output 3.96 USD per 1M tokens, i.e. ~4x flash);
# remember to raise `llm.budget.max_usd` when doing so.
#
# Prices are the peak-hour list prices (USD per 1M tokens) from the same page and
# are only used by the budget guard -- check them before a real spending run.

run:
  name: gold150-deepseek
  limit: null
  abort_on_record_error: false
  log_level: INFO

data:
  path: data/gold150.jsonl
  format: jsonl

llm:
  provider: deepseek
  base_url: null
  api_key_env: null
  stage1_model: deepseek-flash
  stage2_model: deepseek-flash
  temperature: 0
  max_output_tokens: 8000
  timeout_s: 600
  # Stage-level request overrides (they win over llm.model_params): Stage-1 runs
  # without thinking, Stage-2 with thinking.  `high` is DeepSeek's default effort;
  # use `max` for the hardest cases at a higher output cost.
  stage1_params:
    reasoning_effort: none
  stage2_params:
    reasoning_effort: high
  retry:
    max_attempts: 5
    base_delay_s: 2.0
    max_delay_s: 60.0
    jitter_s: 0.5
  budget:
    max_usd: 5.0
    estimated_output_tokens: 1500
    prices_per_1m_tokens:
      deepseek-flash:
        input: 0.30
        output: 1.20
      deepseek-v4-pro:
        input: 1.32
        output: 3.96
  cache:
    enabled: true
    path: artifacts/cache.deepseek.sqlite3

prompts:
  stage1: prompts/stage1_v2_original.md
  stage2: prompts/stage2_v2_original.md
  format: text
  version: v2-paper-2026-11

output:
  dir: artifacts/deepseek-paper
