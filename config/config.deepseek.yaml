# Paper-faithful prompts (verbatim Zenodo appendix) + DeepSeek.
#
# Why DeepSeek: the paper's own appendix already ran deepseek-v3 (Stage-1) and
# deepseek-r1 (Stage-2) through the same code path (call_llm/registry.py), and
# both are reachable from mainland China without a proxy.  Table VII reports
# Stage-1 deepseek-v3 = 94.0% and Stage-2 deepseek-r1 = 95.4% (the best Stage-2
# model in the paper), so this pair is the closest *and* the cheapest substitute
# for GPT-4.1 + o3-mini.  It is still a substitution and must be recorded as a
# deviation (DEV-09 in docs/paper-deviations.md).
#
# Setup:
#   set DEEPSEEK_API_KEY=sk-...          (never put the key in this file)
#   python run.py annotate -c config/config.deepseek.yaml --dry-run
#   python run.py annotate -c config/config.deepseek.yaml --write-report
#
# Prices below are a 2025 snapshot used only by the cost guard; verify them
# against https://api-docs.deepseek.com/quick_start/pricing before trusting the
# reported dollar amount (DEV-05).

run:
  name: gold150-deepseek-paper
  limit: null
  seed: 42
  abort_on_record_error: false
  log_level: INFO

data:
  path: data/gold150.jsonl
  format: auto

llm:
  provider: deepseek            # base_url + key variable come from swep.providers
  stage1_model: deepseek-chat   # V3: paper's Stage-1 substitute
  stage2_model: deepseek-reasoner  # R1: paper's best Stage-2 model
  temperature: 0
  max_output_tokens: 1500
  timeout_s: 600
  max_parse_retries: 2
  retry:
    max_attempts: 5
    base_delay_s: 2.0
    max_delay_s: 60.0
    jitter_s: 0.5
  budget:
    max_usd: 3.0
    prices_per_1m_tokens:
      deepseek-chat: {input: 0.28, output: 0.42}
      deepseek-reasoner: {input: 0.55, output: 2.19}
    default_price: {input: 0.55, output: 2.19}
  cache:
    enabled: true
    path: artifacts/deepseek-paper/cache.sqlite3

prompts:
  stage1: prompts/stage1_v2_original.md
  stage2: prompts/stage2_v2_original.md
  version: v2-paper-2026-11
  format: text                  # the appendix answers with Classification: lines

output:
  dir: artifacts/deepseek-paper
  annotations_csv: annotations.csv
  requests_jsonl: requests.jsonl
  summary_json: summary.json
