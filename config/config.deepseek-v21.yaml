# DeepSeek run over the 150-comment gold sample, prompt v2.1 (Stage-1 guidance).
#
# This configuration only differs from `config.deepseek.yaml` in the Stage-1
# prompt: `prompts/stage1_v2_1_guidance.md` appends four disambiguation rules to
# the verbatim appendix prompt, targeting the four confusions seen in the v2 run
# (see docs/rq2-results.md):
#
#   * gold General predicted None  -- generic improvement lists were read as
#     "no items at all";
#   * gold Valid predicted General -- hedged wording ("could be improved") was
#     read as too vague even when a concrete symbol was named;
#   * gold General predicted Valid -- a walkthrough of the change plus generic
#     advice was read as a valid item.
#
# Stage-2 keeps the verbatim appendix prompt so that the A/B isolates Stage-1.
# Everything else (models, prices, budget, cache) is identical to
# `config.deepseek.yaml`, which keeps the two runs comparable; the cache is a
# separate file because the prompt digest is part of the cache key.

run:
  name: gold150-deepseek-v21
  limit: null
  abort_on_record_error: false
  log_level: INFO

data:
  path: data/gold150.jsonl
  format: jsonl

llm:
  provider: deepseek
  base_url: null
  api_key_env: null
  stage1_model: deepseek-flash
  stage2_model: deepseek-flash
  temperature: 0
  max_output_tokens: 8000
  timeout_s: 600
  stage1_params:
    reasoning_effort: none
  stage2_params:
    reasoning_effort: high
  retry:
    max_attempts: 5
    base_delay_s: 2.0
    max_delay_s: 60.0
    jitter_s: 0.5
  budget:
    max_usd: 5.0
    estimated_output_tokens: 1500
    prices_per_1m_tokens:
      deepseek-flash:
        input: 0.30
        output: 1.20
      deepseek-v4-pro:
        input: 1.32
        output: 3.96
  cache:
    enabled: true
    path: artifacts/cache.deepseek-v21.sqlite3

prompts:
  stage1: prompts/stage1_v2_1_guidance.md
  stage2: prompts/stage2_v2_original.md
  format: text
  version: v2.1-guidance-2026-11-09

output:
  dir: artifacts/deepseek-v21
