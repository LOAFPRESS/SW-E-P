name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==1.55.3" "PyYAML>=5.4,<7" "pytest>=7,<9"
          python -m pip install "pandas==2.0.3" "numpy==1.24.4" "scipy==1.10.1" \
            "scikit-learn==1.3.2" "shap==0.44.1" "matplotlib==3.7.5"

      - name: Run the test suite
        # The suite is offline on purpose: the LLM calls are mocked and the
        # reproduction bundle is built from committed artefacts.
        run: python -m pytest -q

      - name: Check the CLI entry point
        run: |
          python run.py --help
          python run.py validate-data -c config/config.gold150.yaml --quiet
